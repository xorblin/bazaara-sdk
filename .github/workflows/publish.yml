name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build SDK
        run: bun run build

      - name: Publish to NPM
        run: |
          # Fetch local version from package.json
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: $LOCAL_VERSION"
          
          # Fetch registry version (suppress errors if package hasn't been published yet)
          REGISTRY_VERSION=$(npm view @bazaara/sdk version 2>/dev/null || echo "0.0.0")
          echo "Registry version: $REGISTRY_VERSION"
          
          if [ "$LOCAL_VERSION" != "$REGISTRY_VERSION" ]; then
            echo "New version detected. Publishing..."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
            npm publish
            echo "Published successfully!"
          else
            echo "Version $LOCAL_VERSION is already published to NPM. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
